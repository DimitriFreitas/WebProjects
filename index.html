<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho Web - Survivor Engine</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Interface (HUD) -->
    <div id="ui-layer" class="container-fluid py-3">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <!-- Barra de Vida -->
                <div class="progress mb-1 shadow-sm" style="height: 25px; border: 2px solid white;">
                    <div id="hp-bar" class="progress-bar bg-danger fw-bold" role="progressbar" style="width: 100%">100%</div>
                </div>
                <!-- Barra de XP -->
                <div class="progress shadow-sm" style="height: 10px; border: 1px solid #aaa;">
                    <div id="xp-bar" class="progress-bar bg-info" role="progressbar" style="width: 0%"></div>
                </div>
                <!-- Stats -->
                <div class="text-center text-white mt-2 fw-bold text-uppercase stats-text">
                    Nível <span id="level-display" class="badge bg-primary">1</span> | 
                    Kills: <span id="kill-count">0</span> | 
                    Tempo: <span id="timer">00:00</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Level Up -->
    <div id="custom-modal">
        <div class="container">
            <div class="row text-center mb-4">
                <h1 class="text-warning display-4 fw-bold drop-shadow">LEVEL UP!</h1>
                <p class="text-white lead drop-shadow">Escolha uma recompensa:</p>
            </div>
            <div id="cards-container" class="row justify-content-center g-4">
                <!-- Cartas geradas via jQuery -->
            </div>
        </div>
    </div>

    <!-- O Jogo -->
    <canvas id="gameCanvas"></canvas>

    <!-- Scripts: jQuery, Bootstrap e Engine -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="survivorEngine.js"></script>
</body>
</html>
